<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>공유된 묶음 · Tabularium</title>
  <style>
    :root { color-scheme: dark; --bg: #2F3235; --panel: #383c40; --line: #4a4f54; --text: #ececec; --muted: #a9aeb3; --accent: #F28216; --accent-ink: #2F3235; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    .brand { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin-bottom: 8px; }
    h1 { font-size: 22px; margin: 0 0 4px; word-break: break-word; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    li { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px; }
    li:first-child { border-top: 0; }
    li a { color: var(--text); text-decoration: none; display: block; word-break: break-word; }
    li a:hover .t { text-decoration: underline; }
    .t { display: block; font-weight: 500; }
    .u { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .msg { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px; }
    .msg.warn { border-color: var(--accent); }
    .note { color: var(--muted); font-size: 12.5px; margin-top: 20px; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .15s; pointer-events: none; }
    #toast.on { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Tabularium · 공유된 묶음</div>
    <div id="out"><div class="msg">링크를 읽는 중…</div></div>
    <p class="note">이 페이지는 링크 안의 내용을 이 브라우저 안에서만 풀어서 보여 줍니다. 서버로 내용을 보내지 않습니다. 모르는 사람이 보낸 링크는 주소를 확인한 뒤 열어 주세요.</p>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="s.js"></script>
</body>
</html>
