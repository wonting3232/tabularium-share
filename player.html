<!doctype html>
<!-- Tabularium 요약 화면의 영상 재생용 페이지. 확장 화면에 YouTube 재생기를 바로 끼우면 오류 153이 나서 웹페이지를 거친다.
     영상 번호는 주소의 # 뒤에만 받으므로 이 페이지를 올린 서버에는 전달되지 않는다. 사용: player.html#v=<영상ID>&t=<초> -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Tabularium 영상</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<script>
function show() {
  const q = new URLSearchParams(location.hash.slice(1));
  const v = q.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) { document.body.textContent = ''; return; }
  const t = Math.max(0, Math.floor(Number(q.get('t')) || 0));
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  // 시각을 눌러 온 경우에만 바로 재생한다(처음 열 때는 소리를 내지 않는다).
  f.src = `https://www.youtube.com/embed/${v}?rel=0${t || q.get('play') ? `&start=${t}&autoplay=1` : ''}`;
  document.body.replaceChildren(f);
}
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
